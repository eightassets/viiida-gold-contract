name: Dependency CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # solc 0.4.24's legacy soljson build overflows the call stack on
          # newer Node runtimes. Node 10 matches the toolchain generation this
          # repository was built with and is isolated to compile/test only.
          node-version: '10.24.1'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile contracts
        run: yarn compile

      - name: Start Ganache
        run: |
          yarn ganache --deterministic --quiet > /tmp/ganache.log 2>&1 &
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/8545) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ganache.log
          exit 1

      - name: Run contract tests
        run: yarn test
